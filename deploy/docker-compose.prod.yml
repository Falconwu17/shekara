# Продакшн-стенд ШЕКАРЫ (Oracle Cloud, Ubuntu ARM): приложение + Caddy с автоматическим HTTPS.
# Запуск из корня репозитория на сервере:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  app:
    build: ..
    image: shekara:latest
    restart: unless-stopped
    command: ["python", "-m", "online.api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # без ключей сборка не запустится: стенд в интернете не должен быть открыт для управления
      SHEKARA_ADMIN_TOKEN: ${SHEKARA_ADMIN_TOKEN:?задайте в deploy/.env}
      SHEKARA_OPERATOR_TOKEN: ${SHEKARA_OPERATOR_TOKEN:?задайте в deploy/.env}
      SHEKARA_PUBLIC: "1"
      # Telegram-бот аналитика (online/telegram.py): без токена не запускается
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
      SHEKARA_PUBLIC_URL: https://${SHEKARA_DOMAIN}
      # приложение доступно только из сети Docker (expose, не ports): заголовки X-Forwarded-For ставит Caddy
      SHEKARA_TRUSTED_PROXIES: "*"
      SHEKARA_AUTOPLAY: "1"
      SHEKARA_SPEED: ${SHEKARA_SPEED:-600}
      SHEKARA_ACTION_LIMIT: "30"
    volumes:
      - ../data/processed:/app/data/processed:ro
      - ../experiments/results:/app/experiments/results:ro
    expose:
      - "8000"
    # потолок памяти: при утечке перезапускается контейнер, а не зависает вся машина (swap на Oracle нет)
    mem_limit: 6g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHEKARA_DOMAIN: ${SHEKARA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
