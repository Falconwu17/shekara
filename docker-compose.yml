# Стенд ШЕКАРЫ: API протокола и офлайн-дашборд.
# Нужны локально подготовленные data/processed/banks (make data) и experiments/results (make experiment / demo).
#   docker compose up --build   →  API: http://localhost:8000/docs, дашборд: http://localhost:8501
services:
  api:
    build: .
    image: shekara:latest
    command: ["python", "-m", "online.api", "--banks", "${SHEKARA_BANKS:-006,011,01292}", "--host", "0.0.0.0"]
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro

  dashboard:
    image: shekara:latest
    depends_on:
      - api
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    volumes:
      - ./experiments/results:/app/experiments/results:ro
