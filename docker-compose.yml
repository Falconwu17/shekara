# Стенд ШЕКАРЫ: приложение и API (http://localhost:8000) и аналитический дашборд Streamlit (:8501).
# Нужны локально подготовленные data/processed (make data) и experiments/results (эксперимент).
#   docker compose up --build
services:
  api:
    build: .
    image: shekara:latest
    command: ["python", "-m", "online.api", "--host", "0.0.0.0"]
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./experiments/results:/app/experiments/results:ro

  dashboard:
    image: shekara:latest
    depends_on:
      - api
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    volumes:
      - ./experiments/results:/app/experiments/results:ro
